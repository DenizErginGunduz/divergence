<!doctype html>
<html lang="en">

<title>Divergence</title>
<!--
  The skeleton from DESIGN.md, exactly:
    [0]   findings strip     — does not rotate, scrolled by hand, every card
                               carries its source
    [0.5] notable right now  — the selection rule is computed; hidden when empty
    [1]   asset cards        — navigation starts here
    [2]   ladder list        — one row per ladder
    [3]   rung table         — opens IN PLACE
    [4]   detail card        — opens IN PLACE, with the constraint strip

  The token block lives in :root. When theming arrives, ONLY that changes.
  Data is read LIVE from the archive; no hardcoded numbers (except the
  "recorded" strip cards — those carry a date and a decision number).
-->
<style>
:root{
  /* ---------- TOKEN LAYER ---------- */
  --bg:#14110f; --surface:#181411; --surface-2:#1c1713; --border:#2a231d;
  --line:#241e19;
  --text:#f0ece6; --text-2:#c9c0b4; --text-3:#9c8f7e; --text-4:#5a5148;
  --accent:#e8a33d;
  --ok:#7fb069; --warn:#c98a2e; --muted:#5a5148;
  --yes-bg:#1e2a1e; --yes:#8fd18f; --no-bg:#2a1e1e; --no:#d18f8f;
  --font:'Inter var','Inter',system-ui,-apple-system,sans-serif;
  --radius:7px; --gap:8px; --row:38px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding:26px 24px 60px;max-width:1200px;margin:0 auto}
.num{text-align:right} .t12{font-size:12px} .t11{font-size:11px} .t10{font-size:10px}
.dim{color:var(--text-3)} .dim2{color:var(--text-4)} .w5{font-weight:500}
.lab{font-size:10px;letter-spacing:.14em;color:var(--text-3)}

/* ---- full-bleed ----
   body carries max-width:1200px; the helper below escapes it.
   --vw = usable width EXCLUDING the scrollbar, measured in JS.
   100vw counts the scrollbar, so it is not used directly; it would overflow
   horizontally. ONLY the dateline uses this. Content blocks stay inside
   1200px: strips running to the edge of the screen read worse (D-069). */
.bleed{width:var(--vw,100%);
  margin-left:calc(50% - var(--vw,100%)/2)}

/* ---- horizontal slider wrapper ----
   The arrows sit in the gutter beside the content, not at the screen edge. */
.swrap{position:relative;margin-bottom:26px}
.sarr{position:absolute;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;cursor:pointer;z-index:5;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);
  font-size:15px;line-height:1;opacity:0;transition:opacity .15s,border-color .12s;
  display:flex;align-items:center;justify-content:center}
.swrap:hover .sarr{opacity:1}
.sarr:hover{color:var(--accent);border-color:#3a3026}
.sarr.sl{left:-14px} .sarr.sr{right:-14px}
.sarr[hidden]{display:none}
@media(max-width:720px){ .sarr{display:none} }

/* ---- DATELINE (masthead) ---- */
.mast{margin-top:-26px;margin-bottom:26px;background:var(--bg)}
.rule{height:3px;background:var(--accent)}
.mastin{padding:24px 24px 0;max-width:1200px;margin:0 auto}
.mtop{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.wordmark{font-size:42px;font-weight:200;letter-spacing:.14em;color:var(--text);line-height:1}
.slogan{font-size:18px;font-weight:400;color:var(--text-3);margin-top:11px;letter-spacing:-.005em}
.slogan .pm{color:var(--accent);font-weight:500}
.slogan .op{color:var(--text-2);font-weight:500}
.dateline{display:flex;margin-top:22px;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);font-size:10px;letter-spacing:.1em;color:var(--text-3)}
.dateline div{padding:9px 0}
/* ---- sticky band ---- */
#band{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--bg);
  opacity:0;pointer-events:none;transition:opacity .18s ease}
#band.on{opacity:1;pointer-events:auto}
#band .rule{height:2px}
.bandin{display:flex;align-items:center;gap:14px;padding:11px 24px;
  border-bottom:1px solid var(--border);max-width:1200px;margin:0 auto}
.bandwm{font-size:15px;font-weight:200;letter-spacing:.14em;color:var(--text)}
@media(max-width:720px){
  .wordmark{font-size:30px} .slogan{font-size:15px}
  .dateline{flex-wrap:wrap} .dateline div{flex:1 1 50%!important;text-align:left!important}
}

/* [0] findings strip */
/* The strip is a GRID, not a slider (D-069). Four findings on one row;
   two on a narrow screen, then one. No scrolling, nothing cut off. */
#strip{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:26px}
.fcard{min-width:0;border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 15px;background:var(--surface)}
@media(max-width:1000px){ #strip{grid-template-columns:repeat(2,1fr)} }
@media(max-width:600px){ #strip{grid-template-columns:1fr} }
.fcard .n{font-size:31px;font-weight:300;color:var(--accent);line-height:1;letter-spacing:-.02em}
.fcard .b{font-size:12px;font-weight:500;margin:7px 0 6px}
.fcard .t{font-size:11px;color:var(--text-3);line-height:1.55}
.fcard .k{font-size:10px;color:var(--text-4);margin-top:9px;padding-top:7px;border-top:1px solid var(--line)}

/* [0.5] notable — market card convention */
#notable{margin-bottom:0}
#ngrid{display:flex;gap:11px;overflow-x:auto;padding-bottom:10px;scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.ncard{min-width:262px;max-width:262px;flex-shrink:0;
  border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;
  background:var(--surface);cursor:pointer;transition:border-color .12s,opacity .12s}
.ncard:hover{border-color:#3a3026}
/* a card that does not clear the band: stays in place, shown faded (PRODUCT.md 5) */
.ncard.soft{opacity:.6}
.ncard.soft:hover{opacity:1}
.ncard .q{font-size:12px;color:var(--text);line-height:1.45;margin-bottom:11px;min-height:35px}
.chips2{display:flex;gap:6px;margin-bottom:10px}
.oc{flex:1;border-radius:4px;padding:6px 9px}
.oc .k{font-size:9px} .oc .v{font-size:15px}
.oc.yes{background:var(--yes-bg)} .oc.yes .k{color:#6d8a6d} .oc.yes .v{color:var(--yes)}
.oc.no{background:var(--no-bg)}   .oc.no .k{color:#8a6d6d}  .oc.no .v{color:var(--no)}
.nfoot{border-top:1px solid var(--line);padding-top:8px;display:flex;align-items:baseline}

/* [1] asset cards */
#chips{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 11px;border-radius:4px;color:var(--text-3);cursor:pointer;user-select:none}
.chip:hover{color:var(--text-2)} .chip.on{background:var(--border);color:var(--text)}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:8px}
.acard{border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;
  background:var(--surface);cursor:pointer;transition:border-color .12s}
.acard:hover{border-color:#3a3026}
.acard.sel{border-color:var(--accent)}
.acard.none{opacity:.66}
.icon{width:23px;height:23px;border-radius:50%;background:var(--surface-2);display:flex;
  align-items:center;justify-content:center;font-size:9px;font-weight:500;color:var(--text-3);flex-shrink:0}
.an{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:3px}
.an .st{width:9px;flex-shrink:0} .an .lb{width:96px;flex-shrink:0}

/* [2][3] tables */
.sect{font-size:10px;letter-spacing:.14em;color:var(--text-3);margin:26px 0 9px}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:400;color:var(--text-3);text-align:left;letter-spacing:.04em;
  padding:0 9px 7px;border-bottom:1px solid var(--border);white-space:nowrap}
th.num{text-align:right}
td{font-size:12px;padding:0 9px;height:var(--row);border-bottom:1px solid var(--line);
  color:var(--text-2);vertical-align:middle}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--surface)}
tr.quiet td{color:var(--text-4)} tr.open td{background:var(--surface)}
.bar{position:relative;height:12px;min-width:74px}
.bar .band{position:absolute;left:0;top:3px;height:6px;background:#2f2822;border-radius:2px}
.bar .gap{position:absolute;left:0;top:4px;height:4px;border-radius:2px}
.badge{font-size:9px;letter-spacing:.04em;padding:2px 6px;border-radius:3px;border:1px solid;white-space:nowrap}
.b-free{color:var(--ok);border-color:#2f4a26} .b-model{color:var(--warn);border-color:#4a3a12}
.b-none{color:var(--text-4);border-color:var(--border)}

/* [4] detail card */
.detail{border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
  margin:3px 0 10px;background:var(--surface-2);max-width:580px}
.big{display:flex;gap:28px;margin:13px 0 15px}
.big div div:first-child{font-size:10px;letter-spacing:.05em;color:var(--text-3)}
.big div div:last-child{font-size:23px;font-weight:400}
.checks{border-top:1px solid var(--border);padding-top:10px;font-size:11px;color:var(--text-3);line-height:1.85}
.empty{color:var(--text-4);font-size:12px;padding:14px 0}
#err{color:var(--warn);font-size:12px;padding:12px 0}
</style>

<script>
/* ===================== CONTENT LAYER — data, not code ===================== */
const ASSETS=[
 {a:'BTC', l:'Bitcoin',    c:'Crypto',      i:'BTC', ccy:'BTC'},
 {a:'ETH', l:'Ethereum',   c:'Crypto',      i:'ETH', ccy:'ETH'},
 {a:'SPX', l:'S&P 500',    c:'Indices',     i:'SPX'},
 {a:'NDX', l:'Nasdaq-100', c:'Indices',     i:'NDX'},
 {a:'WTI', l:'Crude oil',  c:'Commodities', i:'WTI'},
 {a:'GOLD',l:'Gold',       c:'Commodities', i:'AU'},
 {a:'TSLA',l:'Tesla',      c:'Equities',    i:'TSLA'}];
/* Strip cards. src:'live' -> computed from the archive. src:'rec' -> a recorded
   measurement, where a date and a decision number are REQUIRED. A hand-written
   sentence is not allowed. */
const STRIP=[
 {id:'tail', b:'Tail premium', src:'chain',
  t:()=>'What prediction markets charge for the least likely outcome, versus what the option chain implies.'},

 /* The headline is always_exceeds / distinct_rungs. "Always" is the classifier's
    word for MORE THAN 90% of a rung's observations, not 100% — see
    scripts/stability.py. The text says so, and reports the other two buckets,
    because "the rest never clears" would be false whenever sometimes_exceeds
    is above zero. */
 {id:'costs', b:'Survive costs', src:'findings', d:'D-049',
  read:F=>{ const s=F.measurements.friction_band_kalshi.stability;
    return {n:s.always_exceeds+'/'+s.distinct_rungs,
      t:`Kalshi year-end rungs whose gap beats fees, spread and measurement error `
        +`in over 90% of their observations. ${s.sometimes_exceeds} clear it `
        +`sometimes, ${s.never_exceeds} never. About `
        +`${Math.round(s.observations_per_rung)} observations per rung.`}; }},

 {id:'rep', b:'Model-free setups', src:'findings', d:'D-045 \u00b7 D-049',
  read:F=>{ const m=F.measurements;
    const free=Object.keys(m).filter(k=>m[k] && m[k].model_free===true);
    return {n:String(free.length),
      t:`Independent comparisons that assume no model at all. A third setup `
        +`exists but its bound is too loose to test anything (D-046).`}; }},

 {id:'catch', b:'Caught by a constraint', src:'findings', d:'D-067',
  read:F=>{ const e=F.measurements.exhaustiveness_constraint;
    const worst=Object.keys(e).filter(k=>e[k]&&typeof e[k]==='object')
      .map(k=>e[k]).reduce((a,b)=>Math.abs(b.departure_percent)>Math.abs(a.departure_percent)?b:a);
    return {n:worst.departure_percent.toFixed(1)+'%',
      t:`One bucket boundary off by a cent inflated the density by `
        +`${worst.departure_percent.toFixed(1)}%. Every digital looked perfect alone `
        +`\u2014 only the requirement that they sum to the discount factor exposed it.`}; }}
];
/* Four cards on one row; the strip became a grid, not a slider (D-069).
   The two that were removed are waiting in docs/BACKLOG.md B-010:
   - sync window     : the value is already in the dateline; the card repeated it
   - markets tracked : a scope count, not a finding
   If the strip becomes a slider again, both come back. */

const REPO='https://raw.githubusercontent.com/DenizErginGunduz/divergence/main/';
const API ='https://api.github.com/repos/DenizErginGunduz/divergence/contents/';

/* ===================== DATA ===================== */
async function gz(p){const r=await fetch(REPO+p+'?cb='+Date.now());
 if(!r.ok) throw new Error(p+' → '+r.status);
 return JSON.parse(await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text());}
async function newestPath(dir){const g=await (await fetch(API+dir+'?cb='+Date.now())).json();
 if(!Array.isArray(g)||!g.length) throw new Error(dir);
 const day=g.map(x=>x.name).sort().pop();
 const f=await (await fetch(API+dir+'/'+day+'?cb='+Date.now())).json();
 return dir+'/'+day+'/'+f.map(x=>x.name).sort().pop();}

/* ===================== ARITHMETIC ===================== */
const bracket=(o,K)=>{const ks=Object.keys(o).map(Number).sort((a,b)=>a-b);
 const lo=ks.filter(k=>k<K),hi=ks.filter(k=>k>K);
 return (lo.length&&hi.length)?[lo[lo.length-1],hi[0]]:null;};
function chain(D,p){const idx=D[p].index.result.index_price,ch={};
 for(const b of (D[p].book_summary.result||D[p].book_summary)){
  const q=b.instrument_name.split('-'); if(q.length!==4)continue;
  ((ch[q[1]]||={})[q[3]]||={})[+q[2]]={mark:(b.mark_price||0)*idx,
   bid:b.bid_price?b.bid_price*idx:null, ask:b.ask_price?b.ask_price*idx:null};}
 return {ch,idx};}
/* Discount factor from the put-call residual (D-073). The call side of the
   digital gives D*Q(S>K), the put side gives 1-D*Q(S<K); the difference is
   1-D and carries no Q at all, so this needs no forward and there is no
   circularity with fwd() below. Mirrors scripts/measure_band.py:discount. */
function disc(ch,e){const C=ch[e].C,P=ch[e].P; if(!C||!P)return null;
 const ks=Object.keys(C).map(Number).filter(k=>P[k]).sort((a,b)=>a-b),v=[];
 for(let i=0;i+1<ks.length;i++){const a=ks[i],b=ks[i+1],g=b-a; if(g<=0)continue;
  v.push((1-(P[b].mark-P[a].mark)/g)-((C[a].mark-C[b].mark)/g));}
 if(v.length<8)return null; v.sort((a,b)=>a-b);
 const D=1-v[Math.floor(v.length/2)];
 return (D>.5&&D<=1)?{D,brackets:v.length,spread:v[v.length-1]-v[0]}:null;}
/* Parity is C-P = D*(F-K), so F = K+(C-P)/D. Dividing by nothing assumed
   D=1 and biased F by -(1-D)*(F-K) (D-073). */
function fwd(ch,e,idx,D){const C=ch[e].C,P=ch[e].P,v=[];
 for(const k of Object.keys(C).map(Number)) if(P&&P[k]&&k>.85*idx&&k<1.2*idx) v.push(k+(C[k].mark-P[k].mark)/D);
 v.sort((a,b)=>a-b); return v.length?v[Math.floor(v.length/2)]:null;}
function digital(ch,e,K,F,idx,D){const t=K<F?'P':'C',o=ch[e][t]; if(!o)return null;
 const br=bracket(o,K); if(!br)return null; const[a,b]=br,g=b-a,A=o[a],B=o[b];
 /* Both sides return D*Q(S>K). The put side reaches it as D-D*Q(S<K), not
    1-D*Q(S<K); with D=1 the two coincide, which is why the old line looked
    right for so long (D-073). */
 const p=t==='C'?(A.mark-B.mark)/g:D-(B.mark-A.mark)/g;
 /* low/high are what the spread can be SOLD and BOUGHT for. The put branch
    SUBTRACTS the spread, so its bid/ask pairing inverts — getting that the
    wrong way round leaves every number plausible but inside out. Mirrors
    scripts/measure_band.py:digital, pinned there by tests. se is kept as a
    diagnostic and no longer decides anything. */
 const two=A.bid!=null&&A.ask!=null&&B.bid!=null&&B.ask!=null;
 const se=two?Math.sqrt(((A.ask-A.bid)/2)**2+((B.ask-B.bid)/2)**2)/g:null;
 const low =!two?null:(t==='C'?(A.bid-B.ask)/g:D-(B.ask-A.bid)/g);
 const high=!two?null:(t==='C'?(A.ask-B.bid)/g:D-(B.bid-A.ask)/g);
 const feeOf=x=>Math.min(.0003*idx,.125*x);
 return {p,se,low,high,fee:(feeOf(A.mark)+feeOf(B.mark))/g,pair:[a,b]};}
const MON={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
const expiryMs=l=>{const m=l.match(/^(\d+)([A-Z]{3})(\d{2})$/);
 return m?Date.UTC(2000+ +m[3],MON[m[2]],+m[1],8,0,0):null;};
const short=v=>v>=1000?'$'+(v/1000).toFixed(v%1000?1:0).replace(/\.0$/,'')+'k':'$'+Math.round(v);
const c2=v=>v==null?'—':(v*100).toFixed(2)+'¢';
const f2=v=>v==null?'—':v.toLocaleString('en-US',{maximumFractionDigits:2});

function buckets(KA,D,series,ccy){
 const M=(KA.markets[series]||[]).filter(m=>m.status==='active'); if(!M.length)return null;
 const {ch,idx}=chain(D,ccy), closeMs=Date.parse(M[0].close_time);
 const expiries=Object.keys(ch).filter(e=>ch[e].C&&ch[e].P).map(l=>({l,t:expiryMs(l)}))
   .filter(x=>x.t).sort((a,b)=>a.t-b.t);
 const chosen=expiries.filter(x=>x.t<=closeMs).pop(); if(!chosen)return null;
 /* Discount first: fwd() and digital() both need it. Named DF, not D,
    because D is already this function's Deribit payload — the page threw
    "Identifier 'D' has already been declared" on the first attempt. */
 const dis=disc(ch,chosen.l), DF=dis?dis.D:1;
 const F=fwd(ch,chosen.l,idx,DF); if(!F)return null;
 const S=M.map(m=>({kind:m.strike_type,floor:m.floor_strike,cap:m.cap_strike,
   bid:+m.yes_bid_dollars,ask:+m.yes_ask_dollars,oi:Math.round(+m.open_interest_fp||0)}))
   .sort((a,b)=>((a.floor??a.cap)-(b.floor??b.cap)));
 const rows=[]; let top=0,neg=0;
 for(const m of S){
  let lo=null,hi=null,label='';
  if(m.kind==='less'){hi=Math.round(m.cap); label='below '+short(m.cap);}
  else if(m.kind==='greater'){lo=Math.round(m.floor+.01); label='above '+short(m.floor);}
  else{lo=Math.round(m.floor); hi=Math.round(m.cap+.01); label=short(m.floor)+' – '+short(m.cap);}
  /* An unbounded lower edge is certainty, and certainty is worth D today,
     not 1. That literal 1 is what pinned the bucket sum at 1 for any D. */
  const dL=lo!=null?digital(ch,chosen.l,lo,F,idx,DF):{p:DF,se:0,low:DF,high:DF,fee:0};
  const dH=hi!=null?digital(ch,chosen.l,hi,F,idx,DF):{p:0,se:0,low:0,high:0,fee:0};
  const pm=(m.bid+m.ask)/2, spread=m.ask-m.bid;
  if(!dL||!dH){rows.push({label,pm,spread,oi:m.oi,skipped:'outside option strike range'});continue;}
  const opt=dL.p-dH.p; top+=opt; if(opt<0)neg++;
  const se=(dL.se==null||dH.se==null)?null:Math.sqrt(dL.se**2+dH.se**2);
  const fee=dL.fee+dH.fee;
  /* The bucket is LONG the lower digital and SHORT the upper one, so its
     cheapest executable value pairs the lower leg's bid side with the upper
     leg's ask side. Then two trades, both priced at quotes that exist now. */
  const qt=dL.low!=null&&dL.high!=null&&dH.low!=null&&dH.high!=null;
  const optLow =qt?dL.low-dH.high:null;
  const optHigh=qt?dL.high-dH.low:null;
  const sellPm=qt?m.bid-(optHigh+fee):null;
  const buyPm =qt?(optLow-fee)-m.ask:null;
  const edge=qt?Math.max(sellPm,buyPm):null;
  rows.push({label,pm,pmBid:m.bid,pmAsk:m.ask,opt,optLow,optHigh,
    gap:pm-opt,se,fee,spread,oi:m.oi,
    envelope:qt?optHigh-optLow:null, edge,
    direction:qt?(sellPm>=buyPm?'sell prediction':'buy prediction'):'no two-sided option quote',
    ratio:opt>0?pm/opt:null, exceeds:qt&&edge>0, pair:[dL.pair,dH.pair]});
 }
 return {rows,expiry:chosen.l,closeMs,F,idx,top,neg,series,D:DF,discEstimated:!!dis,
   pmBid:S.reduce((s,x)=>s+x.bid,0), pmAsk:S.reduce((s,x)=>s+x.ask,0)};
}

function strip(){
  const h=S.calc.BTC;

      if(topRow&&topRow.ratio){ n=topRow.ratio.toFixed(1)+'×';
        k=topRow.label?'live · BTC '+topRow.label:'live'; }
    } else if(f.src==='findings' && F){
      try{ const r=f.read(F); n=r.n; t=r.t;
        k='measured '+String(F.archive.last||'').slice(0,10)+' · '+f.d;
      }catch(e){ console.warn('findings card '+f.id, e); k='measurement unavailable'; }
    } else if(f.src==='findings'){

    return `<div class="fcard"><div class="n">${n}</div>

/* Measures the usable width (scrollbar excluded) and writes it to --vw.
   ResizeObserver is required: a scrollbar appearing or disappearing later
   fires no resize event, it only changes the width of the html element. If the
   measurement goes stale, full-bleed blocks land a few pixels off. */
let lastVw = -1;
function measureWidth(){
  const g = document.documentElement.clientWidth;
  if (g === lastVw) return;                 // unchanged: do not touch the style
  lastVw = g;
  document.documentElement.style.setProperty('--vw', g+'px');
}
measureWidth();
addEventListener('resize', measureWidth);
addEventListener('orientationchange', measureWidth);
if(window.ResizeObserver) new ResizeObserver(measureWidth).observe(document.documentElement);
/* Last line of defence. MEASURED: in some environments a viewport change fires
   nothing at all — resize stayed silent, so did ResizeObserver on html and on
   body, and so did visualViewport, while clientWidth fell from 1385 to 885. A
   stale measurement draws the dateline strip at the wrong width. Reading one
   integer twice a second is cheap; if the value has not changed, nothing is
   written. */
setInterval(measureWidth, 500);

/* One slider component; both strips use it.
   It adds a wrapper, puts arrows in the gutters, and wraps to the start at the
   end. NO automatic rotation (DESIGN.md 5.0) — wrapping only happens on click.
   If the content fits, the arrows are hidden; the page does not claim there is
   more to see when there is not. */
function slider(el){
  if(!el || el.dataset.sld) return; el.dataset.sld='1';
  const w=document.createElement('div'); w.className='swrap';
  el.parentNode.insertBefore(w, el); w.appendChild(el);
  const arrow=(c,t,aria)=>{ const b=document.createElement('button');
    b.className='sarr '+c; b.type='button'; b.textContent=t;
    b.setAttribute('aria-label',aria); w.appendChild(b); return b; };
  const L=arrow('sl','‹','previous'), R=arrow('sr','›','next');
  const step=()=>Math.max(240, el.clientWidth*0.8);
  const maxScroll =()=>el.scrollWidth-el.clientWidth;
  /* The target is tracked separately. While a smooth scroll is in flight
     el.scrollLeft reads stale, so on a long strip the "I am at the end" state
     was never seen and the wrap to the start was missed. 140ms after scrolling
     stops, the target is refreshed from the real position. */
  let target=0, idle=0;
  el.addEventListener('scroll',()=>{ clearTimeout(idle);
    idle=setTimeout(()=>{ target=el.scrollLeft; },140); },{passive:true});
  R.onclick=()=>{ target = target>=maxScroll()-4 ? 0 : Math.min(maxScroll(), target+step());
    el.scrollTo({left:target}); };
  L.onclick=()=>{ target = target<=4 ? maxScroll() : Math.max(0, target-step());
    el.scrollTo({left:target}); };
  const refresh=()=>{ const scrollable=maxScroll()>4; L.hidden=!scrollable; R.hidden=!scrollable; };
  refresh(); addEventListener('resize',refresh);
  if(window.ResizeObserver) new ResizeObserver(refresh).observe(el);
}

/* ===================== BOOT ===================== */
(async()=>{
 try{
  /* The pointer first (D-070). state/latest.json is a single raw file; no API
     call. The newest snapshot used to be found by listing the contents API, and
     the counter listed EVERY archive day separately — so the cost grew by one
     call a day: at 12 days, ~18 calls per page load. The unauthenticated limit
     is 60 an hour, i.e. ~3 page opens per visitor, after which the page showed
     "archive unavailable". */
  let pk, pd, ptr=null;
  try{
   const r=await fetch(REPO+'state/latest.json?cb='+Date.now());
   if(r.ok){ const j=await r.json();
    if(j&&j.version===2&&j.paths&&j.paths.kalshi&&j.paths.deribit) ptr=j; }
  }catch(e){}
  if(ptr){ pk=ptr.paths.kalshi; pd=ptr.paths.deribit; }
  else{ /* fallback: if the collector has not written the pointer yet, the old path works */
   [pk,pd]=await Promise.all([newestPath('raw/kalshi'),newestPath('raw/deribit')]); }
  const [KA,D]=await Promise.all([gz(pk),gz(pd)]);
  S.KA=KA; S.D=D;
  /* The recorded measurements. Failing to read this must not take the page down:
     the chain-derived layers below do not depend on it. */
  try{
   const fr=await fetch(REPO+'findings/latest.json?cb='+Date.now());
   if(fr.ok){ const fj=await fr.json(); if(fj&&fj.measurements) S.findings=fj; }
  }catch(e){ console.warn('findings', e); }
  if(ptr){
   const ar=ptr.archive||{};
   S.meta={syncWindow:ptr.sync_window_seconds, at:ptr.snapshot_utc,
           day:ar.day_count, seq:ar.snapshot_count};
  }else try{
   const mg=await (await fetch(API+'raw/_meta?cb='+Date.now())).json();
   const day=mg.map(x=>x.name).sort().pop();
   const mf=await (await fetch(API+'raw/_meta/'+day+'?cb='+Date.now())).json();
   const m=await (await fetch(REPO+'raw/_meta/'+day+'/'+mf.map(x=>x.name).sort().pop()+'?cb='+Date.now())).json();
   S.meta={syncWindow:m.sync_window_seconds, at:m.snapshot_utc, day:mg.length};
   // NO. = total number of snapshots in the archive
   try{
    const counts=await Promise.all(mg.map(async d=>{
     const f=await (await fetch(API+'raw/_meta/'+d.name+'?cb='+Date.now())).json();
     return Array.isArray(f)?f.length:0;}));
    S.meta.seq=counts.reduce((a,b)=>a+b,0);
   }catch(e){}
  }catch(e){}
  // measurable terminal ladders
  for(const [a,series,ccy] of [['BTC','KXBTCY','BTC'],['ETH','KXETHY','ETH']]){
   try{const h=buckets(KA,D,series,ccy); if(h) S.calc[a]=h;}catch(e){console.warn(a,e);}
  }
  // ladder list: ALL live Kalshi series for that asset
  const catSeries=(KA.catalogue&&KA.catalogue.Crypto&&KA.catalogue.Crypto.series)||[];
  const byTicker=Object.fromEntries(catSeries.map(x=>[x.ticker,x]));
  for(const [t,v] of Object.entries(KA.markets||{})){
   if(!Array.isArray(v)) continue;
   const activeMarkets=v.filter(m=>m.status==='active'); if(!activeMarkets.length) continue;
   const tagList=(byTicker[t]&&byTicker[t].tags)||[];
   const a=tagList.includes('BTC')?'BTC':(tagList.includes('ETH')?'ETH':null); if(!a) continue;
   const endsMs=activeMarkets.map(m=>Date.parse(m.close_time)).filter(Boolean);
   (S.ladders[a] ||= []).push({t, title:(byTicker[t]&&byTicker[t].title)||t,
     kind:(byTicker[t]&&byTicker[t].frequency)||'—', n:activeMarkets.length,
     oi:Math.round(activeMarkets.reduce((s,m)=>s+(+m.open_interest_fp||0),0)),
     expiry:endsMs.length?new Date(Math.max(...endsMs)).toISOString().slice(0,10):'—'});
  }
  for(const k in S.ladders) S.ladders[k].sort((a,b)=>b.oi-a.oi);
  dateline();
  draw();
 }catch(e){
  document.getElementById('err').textContent='archive read failed: '+e.message;
  document.getElementById('dl-date').textContent='archive unavailable'; draw();
 }
})();
</script>
