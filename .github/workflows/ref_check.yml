name: ref-check

# Two checks on the written pages.
#
# 1. Decision references: every D-XXX number mentioned in the docs or the
#    interface must have a counterpart in DECISIONS.md.
# 2. README numbers: the result sentences in README.md must still match
#    findings/latest.json (D-090).
#
# Why it exists: the finding cards in the interface printed "D-049" and
# "D-045 . D-046 . D-066" while those decisions had never been written. The
# screen was citing records that did not exist, and a human noticed it, not the
# code. This workflow stops the same thing recurring quietly.
#
# It does not touch the collector, needs no network access, and takes seconds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ref-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Does every Python file compile? This step runs on every push.
      #
      # Why it exists: on 2026-09-11 a half-finished line was committed to
      # collect.py (a truncated paste, an unterminated string). The collector
      # crashed through 5 runs and no snapshot was taken for two days. Nobody
      # noticed, because nothing was red — the scheduled run was failing
      # silently.
      #
      # A syntax error is the cheapest class of error to catch; leaving it for
      # the next scheduled run is the most expensive choice available.
      - name: Do the Python files compile
        run: |
          python -m compileall -q collector scripts
          echo 'all files compiled'

      # First prove the checker CAN CATCH. A checker that catches nothing also
      # stays green, so this step comes before the real check.
      - name: Checker self-test
        run: python scripts/ref_check.py --self-test

      # A dangling reference exits 1 -> the run goes red.
      - name: Check decision references
        run: python scripts/ref_check.py --list

      # Same idea, different failure: the README had copied measured numbers
      # into prose and the prose went stale while every generated surface stayed
      # correct (D-090). This rebuilds those sentences from findings/latest.json
      # and demands them verbatim. Self-test first, for the same reason as above.
      - name: README checker self-test
        run: python scripts/check_readme.py --self-test

      - name: Does the README still match the findings
        run: python scripts/check_readme.py
