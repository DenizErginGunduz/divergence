name: measure

# Olcumleri REPO kosturur, insan degil.
#
# Neden: ekrandaki "0/44" ve "%13" gibi kayitli sayilarin repoda yeniden
# uretilebilir bir yolu yoktu — eski betikler artik var olmayan bir dosya
# duzenini (raw/_store.json, inventory/*.csv) okuyordu. Denetimde yakalandi.
#
# Bundan sonra her olcum ham arsivden hesaplanir ve ciktisi loga yazilir.
# Ham veri degismedigi icin (kural 2) ayni anlik goruntu her zaman ayni
# sayiyi verir; yani sonuc tekrarlanabilir ve kontrol edilebilir.
#
# Ag erisimi YOK: yalnizca depodaki dosyalar okunur.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/measure.yml'

permissions:
  contents: write        # findings/latest.json commit edilecek

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Once arsiv okuma yolunun calistigini kanitla. Bu adim kirmiziysa
      # sonraki her olcum anlamsizdir.
      - name: Arsiv okuma duman testi
        run: python scripts/arsiv.py

      # Surtunme bandi: fark, islem maliyetini asiyor mu? Butun arsiv taranir,
      # cunku tek anlik goruntuden anlamlilik iddia edilemez.
      - name: Surtunme bandi olcumu
        run: python scripts/measure_band.py

      # Tuketicilik: kova toplami 1 olmak zorunda. Uc sinir kurali karsilastirilir;
      # hatalari sayilar degil kisitlar yakaladi (D-067).
      - name: Tuketicilik kisiti olcumu
        run: python scripts/measure_exhaustive.py

      # Ucuncu bagimsiz kurulum: Polymarket gunluk terminal merdivenleri.
      # touch ("hit") merdivenleri acikca elenir; vade boslugu raporlanir.
      - name: Polymarket terminal merdivenleri
        run: python scripts/measure_polymarket.py

      # Ucuncu kurulum ve tek MODEL VARSAYAN olcum. En degerli ciktisi
      # aritmetik ihlaller: touch olasiligi terminalden kucuk olamaz.
      - name: Uzun ufuk touch siniri
        run: python scripts/measure_touch.py

      # Sonuclari dosyaya yaz. Log okunmuyor (API yonetici yetkisi istiyor,
      # arayuz sanallastirilmis); dosya hem okunur hem kalici hem de ekran
      # bunu okuyacak. Kayit ile ekran boylece ayrilamaz hale geliyor.
      - name: Bulgulari yaz
        run: python scripts/write_findings.py

      - name: findings/ degistiyse commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add findings/
          if git diff --staged --quiet; then
            echo "findings/ degismedi, commit yok"
          else
            git commit -m "findings: olcum sonuclari guncellendi (otomatik)"
            git push
          fi
