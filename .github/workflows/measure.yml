name: measure

# The REPOSITORY runs the measurements, not a person.
#
# Why: the recorded numbers on screen — "0/44", "13%" — had no reproducible path
# in the repository. The old scripts read a file layout that no longer existed
# (raw/_store.json, inventory/*.csv). Caught during an audit.
#
# From here on every measurement is computed from the raw archive and its output
# goes into the log. Because raw data is never modified (rule 2), the same
# snapshot always yields the same number; the result is repeatable and checkable.
#
# NO network access: only files already in the repository are read.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/measure.yml'

permissions:
  contents: write        # findings/latest.json gets committed

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Read the FULL archive instead of the 14-day public window, when that is
      # possible. The private mirror holds every snapshot since 2026-08-30; the
      # public repository keeps a rolling window for data rights
      # (docs/DATA_SOURCES.md), and that decision is not reversed here —
      # nothing new is published, only findings come out.
      #
      # workflow_dispatch ONLY. measure also runs on pull_request, and a
      # same-repo PR can read secrets; a PR should prove the code, not be handed
      # a credential. It is also the right scope: a PR measuring the 14-day
      # window is a faster and perfectly valid check.
      #
      # Sparse on purpose. Measured 2026-09-15: events/, holders/ and coverage/
      # are 55% of the archive and no measurement reads any of them. Cloning
      # them would double the transfer for nothing.
      #
      # A missing or expired token is NOT a failure. The step exits and every
      # measurement below runs on the public window, which is what it did before
      # this step existed. The scope is printed by each script and recorded in
      # findings/, so a narrowed run is visible rather than silent.
      - name: Read the full archive from the private mirror
        if: github.event_name == 'workflow_dispatch'
        env:
          ARCHIVE_TOKEN_RO: ${{ secrets.ARCHIVE_TOKEN_RO }}
        run: |
          if [ -z "$ARCHIVE_TOKEN_RO" ]; then
            echo "ARCHIVE_TOKEN_RO not set — measuring the 14-day public window."
            exit 0
          fi
          if ! git clone --quiet --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${ARCHIVE_TOKEN_RO}@github.com/DenizErginGunduz/divergence-archive.git" \
            /tmp/mirror; then
            echo "::warning::Mirror clone failed — most likely an expired ARCHIVE_TOKEN_RO."
            echo "::warning::Measuring the 14-day public window instead."
            exit 0
          fi
          cd /tmp/mirror
          git sparse-checkout set raw/_meta raw/kalshi raw/deribit raw/polymarket_events
          echo "DIVERGENCE_RAW=/tmp/mirror/raw" >> "$GITHUB_ENV"
          echo "mirror: $(du -sh /tmp/mirror/raw | cut -f1), $(ls /tmp/mirror/raw/_meta | wc -l) days"

      # First prove the archive read path works. If this step is red, every
      # measurement after it is meaningless.
      - name: Archive read smoke test
        run: python scripts/archive.py

      # Before any price is compared: do the two contracts pay out on the same
      # event? This reads Kalshi's rules_primary rather than trusting the three
      # numeric fields, and it is deliberately the first measurement, because a
      # number computed for the wrong event is worse than no number. It exits
      # non-zero on a MISMATCH; UNKNOWN is reported but does not fail, since an
      # unrecognised sentence is a gap in the script until someone reads it.
      - name: Event semantics
        run: python scripts/audit_semantics.py

      # Does the converted chain behave like a USD present value at all? This
      # runs FIRST among the measurements because every number after it depends
      # on the answer. A residual that drifts with moneyness means the inverse
      # conversion is not producing what the rest of the pipeline assumes.
      - name: Put-call cross-check
        run: python scripts/measure_parity.py

      # Four estimates of the discount factor side by side, as implied rates
      # (D-093): the current estimator, the parity slope (an estimator-
      # consistency check, not independent), the futures basis from
      # underlying_price, and a dated external rate. Writes
      # findings/discount_referee.json. No referee is declared right.
      - name: Discount-factor referees
        run: python scripts/discount_referee.py

      # Friction band: does the gap beat the cost of trading it? The whole
      # archive is scanned, because no single snapshot can carry significance.
      - name: Friction band
        run: python scripts/measure_band.py

      # Exhaustiveness: an exhaustive bucket set is worth the discount factor D
      # today, not 1 (D-073). Three boundary rules are compared; constraints
      # caught the bug, not numbers (D-067).
      - name: Exhaustiveness constraint
        run: python scripts/measure_exhaustive.py

      # Third independent setup: Polymarket daily terminal ladders. Touch
      # ("hit") ladders are excluded explicitly; the expiry gap is reported.
      - name: Polymarket terminal ladders
        run: python scripts/measure_polymarket.py

      # Third setup, and the only MODEL-ASSUMING measurement. Its most valuable
      # output is the arithmetic violations: touch cannot be rarer than terminal.
      - name: Long-horizon touch bound
        run: python scripts/measure_touch.py

      # Two approximations under every digital: the strike grid it is
      # differenced across, and the expiry date that is not the settlement
      # date. Reported as a range, never as a correction — the point of a
      # sensitivity test is a band.
      - name: Sensitivity — strike grid and expiry band
        run: python scripts/measure_sensitivity.py

      # The pre-committed kill test for the one rung that survives the
      # maturity stress test (D-092). Its verdict rules were written before
      # the script; the script only applies them. Writes
      # findings/kill_test_eth5k.json.
      - name: Kill test — ETH above $5,000 against the local grid
        run: python scripts/kill_test_eth5k.py

      # The buyer's comparison (D-114): for the same terminal payoff, which
      # venue charged less to buy it, one side's costs only. Its verdict rules
      # were written before the script, like the kill test's. Writes
      # findings/payoff_frontier.json; the combo-fee sensitivity rides along
      # and never enters the verdict (D-115).
      - name: Buyer's comparison — the same payoff on Kalshi and on Deribit
        run: python scripts/measure_payoff.py

      # What holding a linear position has cost, per venue (D-119): Hyperliquid's
      # and Polymarket's perpetual funding over the last day and week, and
      # Deribit's dated futures over the index. Writes findings/carry.json.
      # Descriptions of what was charged, not forecasts.
      - name: Carry — funding per venue and the dated futures' premium
        run: python scripts/measure_carry.py

      # The third settlement difference (D-075), measured rather than left
      # UNKNOWN: Kalshi settles on BRTI, Deribit on its own index, and both
      # halves are already archived.
      - name: Settlement basis
        run: python scripts/measure_basis.py

      # How much could ever be scored against an outcome, and how much of
      # that is independent. Counting before scoring: a Brier score over what
      # turns out to be one draw is a decoration.
      - name: Validation inventory
        run: python scripts/inventory_validation.py

      # Write the results to a file. Logs are not readable (the API needs admin
      # rights, the UI view is virtualised); a file is readable, durable, and the
      # page will read it. Record and screen become inseparable that way.
      - name: Write findings
        run: python scripts/write_findings.py

      # Only on a manual run. On a pull_request the checkout is a detached merge
      # commit with no upstream branch, so a push cannot succeed — and a PR run
      # should prove the numbers, not write to the branch.
      - name: Commit findings/ if it changed
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add findings/
          if git diff --staged --quiet; then
            echo "findings/ unchanged, nothing to commit"
          else
            git commit -m "findings: measurement results updated (automated)"
            git push
          fi
