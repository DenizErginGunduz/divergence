name: collect

# Neden bu saatler: orta/uzun vade merdivenlerle calisiyoruz (D-019), saniye
# cozunurlugune ihtiyacimiz yok. Gunde uc kosu; biri ABD acilisi oncesi, biri
# kapanis sonrasi, biri Asya seansinda. Boylece gunluk sekil de yakalanir.
on:
  schedule:
    - cron: '0 13 * * *'    # 13:00 UTC — ABD acilisindan once
    - cron: '0 21 * * *'    # 21:00 UTC — ABD kapanisindan sonra
    - cron: '0 5  * * *'    # 05:00 UTC — Asya seansi + gunun holders cekimi
  workflow_dispatch:         # elle de tetiklenebilsin

# Kosu, kendi reposuna yazacak. Baska hicbir izin yok.
permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false   # bir kosu digerini kesmesin; her snapshot degerli

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bagimlilik YOK. Betik yalnizca standart kutuphane kullaniyor;
      # boylece kirilacak bir paket zinciri de yok.
      - name: Snapshot al
        run: python collector/collect.py

      # Tam arsivi private aynaya it — BUDAMADAN ONCE.
      # Public repo 14 gunluk kayan pencere tutuyor (veri haklari ve depo boyutu,
      # bkz. docs/DATA_SOURCES.md). Ayna hicbir seyin kaybolmadigi yer: uzun
      # seri gerektiren olcumler (farkin kendi tarihine gore konumu, vade
      # yaklasirken davranis, rejim degisimi) buradan beslenecek.
      #
      # ARCHIVE_TOKEN tanimli degilse adim sessizce atlanir; boylece sir
      # eklenene kadar toplayici bozulmaz.
      - name: Tam arsivi private aynaya it
        env:
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: |
          if [ -z "$ARCHIVE_TOKEN" ]; then
            echo "ARCHIVE_TOKEN yok — ayna atlandi. Public pencere yine de calisiyor."
            exit 0
          fi
          git clone --quiet --depth 1 \
            "https://x-access-token:${ARCHIVE_TOKEN}@github.com/DenizErginGunduz/divergence-archive.git" \
            /tmp/ayna
          mkdir -p /tmp/ayna/raw /tmp/ayna/state
          # -n: var olani EZME. Ham veri degismez (kural 2); ayna yalnizca ekler.
          cp -rn raw/.  /tmp/ayna/raw/  2>/dev/null || true
          cp -r  state/. /tmp/ayna/state/ 2>/dev/null || true
          cd /tmp/ayna
          git config user.name  "divergence-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "aynada degisiklik yok"
          else
            git commit --quiet -m "archive: ${GITHUB_RUN_NUMBER} ($(date -u +%Y-%m-%dT%H%MZ))"
            git push --quiet
            echo "ayna guncellendi"
          fi

      - name: Repoya isle
        run: |
          git config user.name  "divergence-collector"
          git config user.email "actions@users.noreply.github.com"
          # state/ de islenmeli: su isareti orada tutuluyor. Kaybolursa bir
          # sonraki kosu her marketi "ilk kez" sanar ve tekrar yazar.
          git add raw/ state/
          if git diff --staged --quiet; then
            echo "Degisiklik yok — islenecek bir sey bulunamadi."
            exit 0
          fi
          git commit -m "snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Baska bir kosu araya girmis olabilir; once cek sonra it.
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push
